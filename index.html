<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYDREAM DIGITAL SEVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .service-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; cursor: pointer; background: white; border-radius: 12px; }
        .service-card:hover { transform: translateY(-8px); border-color: #ef4444; box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
        .error-msg { background-color: #fee2e2; color: #b91c1c; padding: 8px 12px; border-radius: 4px; font-size: 10px; margin-top: 4px; display: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
        .modal.active { display: flex; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .news-scroll { display: inline-block; white-space: nowrap; animation: scrollText 25s linear infinite; }
        .success-card { background: white; padding: 30px; border-radius: 24px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="bg-red-600 text-white py-2 overflow-hidden border-b border-red-700 relative z-[60]">
        <div class="news-scroll font-bold text-xs uppercase tracking-widest" id="news-ticker">
            🔥 Latest Update: Govt makes Aadhar-PAN linking mandatory | 🛡️ Processing time: 120 minutes | 🚀 Digital Seva updates.
        </div>
    </div>

    <header class="bg-white border-b py-4 px-4 md:px-8 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2">
                <img src="https://i.postimg.cc/W1zjssrk/LOGO.jpg" alt="MyDream Logo" class="h-10 w-auto rounded-lg shadow-sm">
                <span class="text-[10px] font-bold text-gray-400 border-l pl-2 uppercase">Digital SERVICES</span>
            </div>
            <a href="https://wa.me/918919580315" class="text-[10px] font-bold text-green-600 border border-green-200 px-3 py-2 rounded-lg uppercase">WhatsApp Care 🟢</a>
        </div>
    </header>

    <main class="container mx-auto mt-6 px-4 pb-10">
        <h2 class="bg-slate-900 text-white py-3 px-6 text-sm font-black rounded-t-xl text-center uppercase mb-6 italic">General Services</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12" id="general-grid"></div>
    </main>

    <div id="formModal" class="modal">
        <div class="bg-white w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl relative mx-2 max-h-[95vh] flex flex-col">
            <button onclick="closeForm()" class="absolute top-4 right-6 text-3xl font-bold text-gray-400">&times;</button>
            <div class="flex flex-col md:flex-row overflow-y-auto">
                <div id="paymentSidebar" class="md:w-5/12 bg-slate-900 p-8 text-white flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] text-blue-400 font-bold uppercase mb-2">Secure Payment</p>
                    <div class="bg-white p-2 rounded-xl mb-4 border-4 border-slate-700">
                        <img src="https://i.postimg.cc/d3JSJL8m/Whats-App-Image-2026-03-20-at-1-18-04-PM.jpg" class="w-32 h-32 md:w-48 md:h-48">
                    </div>
                    <p class="text-3xl font-black">₹<span id="priceSpan">0</span></p>
                    <a id="payBtn" href="#" class="text-[10px] font-bold bg-blue-600 px-8 py-3 rounded-full inline-block mt-4 uppercase">Pay via App 📱</a>
                </div>

                <div class="md:w-7/12 p-6 md:p-10">
                    <h3 id="modalTitle" class="text-xl font-black text-slate-900 mb-6 uppercase">Service Form</h3>
                    <form id="applyForm" onsubmit="validateForm(event)" class="space-y-4">
                        <input type="hidden" id="hiddenServiceName">
                        <div id="dynamicFields" class="grid grid-cols-1 gap-4"></div>
                        <div id="uploadContainer" class="grid grid-cols-2 gap-3 pt-4 border-t"></div>
                        <div id="formErr" class="error-msg text-center">Please fill all fields!</div>
                        <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase shadow-xl">Pay & Submit📤</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="success-card">
            <div class="text-5xl mb-4 animate-bounce">✅</div>
            <h3 class="text-xl font-black text-slate-900 uppercase">Submission Successful</h3>
            <div class="bg-slate-100 p-4 rounded-2xl my-6 border-2 border-dashed border-blue-400">
                <p id="displayUniqueID" class="text-2xl font-black text-blue-600 tracking-tighter">MD-000000</p>
            </div>
            <button id="waNotifyBtn" class="w-full bg-green-500 text-white py-3 rounded-xl font-black text-xs mb-3 shadow-lg">WhatsApp ID 📱</button>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs uppercase">Done</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZMNWtjQBAtWSgEO8--PKRsDAqoac-h_R5-_DwiSt-S6yiTNEcP2mkbrTFAX89Zako/exec";

        const services = {
            "pan": { name: "PAN Card (New/Correction)", price: 250, icon: "🛡️", fields: [{n: "Type", p: "New or Correction", s: ["New PAN", "Correction"]}, {n: "Name", p: "Name"}, {n: "DOB", p: "DOB", t: "date"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Photo", "Sign", "Payment Receipt"] },
            "voter": { name: "Voter Card (New/Correction)", price: 100, icon: "🗳️", fields: [{n: "Type", p: "New or Correction", s: ["New Voter", "Correction"]}, {n: "Name", p: "Full Name"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Photo", "Sign", "Payment Receipt"] },
            "udyam": { name: "Udyam Registration", price: 300, icon: "🏢", fields: [{n: "Business_Name", p: "Business Name"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Pan", "Payment Receipt"] }
        };

        function openForm(id) {
            const s = services[id];
            document.getElementById('modalTitle').innerText = s.name;
            document.getElementById('hiddenServiceName').value = s.name;
            document.getElementById('priceSpan').innerText = s.price;
            document.getElementById('payBtn').href = `upi://pay?pa=raja891958@ybl&pn=MyDream&am=${s.price}&cu=INR`;
            
            document.getElementById('dynamicFields').innerHTML = s.fields.map(f => {
                let attr = `name="${f.n}" placeholder="${f.p}" required class="w-full p-3 border rounded-xl text-xs outline-none focus:border-red-600"`;
                if(f.s) return `<select ${attr}>${f.s.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>`;
                return `<input type="${f.t || 'text'}" ${attr}>`;
            }).join('');
            
            document.getElementById('uploadContainer').innerHTML = s.files.map(file => `<div class="p-3 border rounded-xl bg-slate-50 text-center"><p class="text-[8px] font-black uppercase text-slate-400">${file}</p><input type="file" required class="text-[8px] w-full"></div>`).join('');
            document.getElementById('formModal').classList.add('active');
        }

        async function validateForm(event) {
            event.preventDefault();
            const form = document.getElementById('applyForm');
            const submitBtn = document.getElementById('submitBtn');
            const fileInputs = document.querySelectorAll('#uploadContainer input[type="file"]');
            
            if(!form.checkValidity()) { document.getElementById('formErr').style.display = 'block'; return; }
            
            const masterID = "MD-" + Math.floor(Math.random() * 900000 + 100000);
            submitBtn.innerHTML = "Sending Details... ⏳";
            submitBtn.disabled = true;

            const filesArray = [];
            const readFile = (file) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, type: file.type, base64: reader.result.split(',')[1] });
            });

            for (const input of fileInputs) { if (input.files[0]) filesArray.push(await readFile(input.files[0])); }

            const formData = new FormData(form);
            const serviceName = document.getElementById('hiddenServiceName').value;
            const dataObj = { Unique_ID: masterID, Selected_Service: serviceName, filesArray: filesArray };
            formData.forEach((value, key) => { if(typeof value === 'string') dataObj[key] = value; });

            try {
                // 1. AWAIT FOR DATA (Sheets ki data poyevaraku wait chesthundhi)
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(dataObj) });

                // 2. SUCCESS CARD SETUP
                document.getElementById('displayUniqueID').innerText = masterID;
                document.getElementById('waNotifyBtn').onclick = () => {
                    const msg = `Hello MyDream, My ID: ${masterID} for ${serviceName}`;
                    window.open(`https://wa.me/918919580315?text=${encodeURIComponent(msg)}`, '_blank');
                };

                // 3. TRIGGER PAYMENT & SHOW CARD
                document.getElementById('formModal').classList.remove('active');
                document.getElementById('successModal').classList.add('active');
                
                window.location.href = document.getElementById('payBtn').href;

            } catch (e) {
                alert("Error: Check Internet!");
                submitBtn.disabled = false;
            }
        }

        function closeForm() { document.getElementById('formModal').classList.remove('active'); }
        function renderGrid() {
            const grid = document.getElementById('general-grid');
            grid.innerHTML = "";
            Object.keys(services).forEach(id => {
                const s = services[id];
                grid.innerHTML += `<div class="service-card p-6 flex flex-col items-center text-center" onclick="openForm('${id}')"><div class="text-3xl mb-3">${s.icon}</div><h4 class="font-bold text-[10px] uppercase">${s.name}</h4><p class="text-red-600 font-black text-sm mt-2">₹${s.price}</p></div>`;
            });
        }
        renderGrid();
    </script>
</body>
</html>
