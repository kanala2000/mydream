<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYDREAM DIGITAL SEVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .service-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; cursor: pointer; background: white; border-radius: 12px; }
        .service-card:hover { transform: translateY(-8px); border-color: #ef4444; box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
        .modal.active { display: flex; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .news-scroll { display: inline-block; white-space: nowrap; animation: scrollText 25s linear infinite; }
        .success-card { background: white; padding: 30px; border-radius: 24px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 2px solid #ef4444; }
    </style>
</head>
<body>

    <div class="bg-red-600 text-white py-2 overflow-hidden border-b border-red-700 relative z-[60]">
        <div class="news-scroll font-bold text-xs uppercase tracking-widest" id="news-ticker">
            🔥 Latest Update: Govt makes Aadhar-PAN linking mandatory | 🛡️ Processing time: 120 minutes | 🚀 Digital Seva updates.
        </div>
    </div>

    <header class="bg-white border-b py-4 px-4 md:px-8 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2">
                <img src="https://i.postimg.cc/W1zjssrk/LOGO.jpg" alt="MyDream Logo" class="h-10 w-auto rounded-lg shadow-sm">
                <span class="text-[10px] font-bold text-gray-400 border-l pl-2 uppercase">Digital SERVICES</span>
            </div>
            <button onclick="window.location.href='https://api.whatsapp.com/send?phone=918919580315'" class="bg-green-600 text-white px-4 py-2 rounded-lg text-[10px] font-bold uppercase shadow-md">WhatsApp Support 🟢</button>
        </div>
    </header>

    <main class="container mx-auto mt-6 px-4 pb-10">
        <h2 class="bg-slate-900 text-white py-3 px-6 text-sm font-black rounded-t-xl text-center uppercase tracking-widest italic mb-6">General Services</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12" id="general-grid"></div>
        
        <div class="bg-blue-50 border border-blue-100 p-8 rounded-3xl text-center mb-10 shadow-sm max-w-4xl mx-auto">
            <h3 class="text-xl font-black text-blue-900 mb-2 uppercase tracking-tight">Become a PAN Agent</h3>
            <button onclick="openForm('agent_reg')" class="bg-blue-800 text-white px-10 py-3 rounded-xl font-bold uppercase shadow-lg hover:bg-blue-900 transition">Register Now</button>
        </div>
    </main>

    <div id="formModal" class="modal">
        <div class="bg-white w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl relative mx-2 max-h-[95vh] flex flex-col">
            <button onclick="closeForm()" class="absolute top-4 right-6 text-3xl font-bold text-gray-400 hover:text-black z-10">&times;</button>
            <div class="flex flex-col md:flex-row overflow-y-auto">
                <div id="paymentSidebar" class="md:w-5/12 bg-slate-900 p-8 text-white flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] text-blue-400 font-bold uppercase mb-2">Secure Payment</p>
                    <div class="bg-white p-2 rounded-xl mb-4 border-4 border-slate-700">
                        <img src="https://i.postimg.cc/d3JSJL8m/Whats-App-Image-2026-03-20-at-1-18-04-PM.jpg" class="w-32 h-32 md:w-48 md:h-48 object-contain">
                    </div>
                    <p class="text-3xl md:text-4xl font-black">₹<span id="priceSpan">0</span></p>
                    <p id="priceInfo" class="text-[10px] text-slate-400 mt-2 font-bold italic"></p>
                    <a id="payBtn" href="#" class="text-[10px] font-bold bg-blue-600 px-8 py-3 rounded-full inline-block mt-4 uppercase hover:bg-blue-700 transition active:scale-95">Pay via App 📱</a>
                </div>

                <div id="formSection" class="md:w-7/12 p-6 md:p-10">
                    <h3 id="modalTitle" class="text-xl md:text-2xl font-black text-slate-900 mb-6 uppercase italic">Service Form</h3>
                    <div id="panImages" class="hidden grid grid-cols-2 gap-4 mb-6">
                        <div class="text-center"><p class="text-[8px] font-bold">Emergency</p><img src="https://i.postimg.cc/4dpSXcnz/download.jpg" class="h-20 w-full object-cover rounded-lg border"></div>
                        <div class="text-center"><p class="text-[8px] font-bold">Manual</p><img src="https://i.postimg.cc/KztHmT4P/sinp.jpg" class="h-20 w-full object-cover rounded-lg border"></div>
                    </div>

                    <div id="trackingUI" class="hidden text-center py-10">
                        <input type="text" id="trackIDInput" placeholder="Enter MD-ID" class="w-full p-4 border-2 rounded-xl text-center font-black outline-none mb-4 focus:border-blue-600">
                        <button onclick="fetchStatus()" id="trackBtn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold uppercase w-full">Track Now 🔍</button>
                        <div id="statusResult" class="mt-8 p-6 rounded-2xl hidden bg-slate-50 border border-slate-200">
                            <p id="statusText" class="text-2xl font-black text-blue-700 italic">---</p>
                        </div>
                    </div>

                    <form id="applyForm" onsubmit="validateForm(event)" class="space-y-4">
                        <input type="hidden" id="hiddenServiceName">
                        <div id="dynamicFields" class="grid grid-cols-1 gap-4"></div>
                        <div id="correctionFields" class="space-y-4"></div>
                        <div id="uploadContainer" class="grid grid-cols-2 gap-3 pt-4 border-t"></div>
                        <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase tracking-widest shadow-xl active:scale-95 mt-4">Pay & Submit📤</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="success-card">
            <div class="text-5xl mb-4 animate-bounce">✅</div>
            <h3 class="text-xl font-black text-slate-900 uppercase">Submission Successful</h3>
            <div class="bg-slate-100 p-4 rounded-2xl my-6 border-2 border-dashed border-blue-400">
                <p id="displayUniqueID" class="text-2xl font-black text-blue-600 tracking-tighter">MD-000000</p>
            </div>
            <button id="waNotifyBtn" class="w-full bg-green-500 text-white py-3 rounded-xl font-black text-xs mb-3 shadow-lg">WhatsApp ID 📱</button>
            <button onclick="closeSuccess()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs uppercase">Done</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZMNWtjQBAtWSgEO8--PKRsDAqoac-h_R5-_DwiSt-S6yiTNEcP2mkbrTFAX89Zako/exec";

        const services = {
            "pan": { name: "PAN Card (New/Correction)", price: 250, icon: "🛡️", fields: [{n: "Type", p: "New/Correction", s: ["New PAN", "Correction"]}, {n: "Speed", p: "Speed", s: ["Manual (3Days)", "Emergency (2Hrs)"]}, {n: "Name", p: "Name"}, {n: "Father", p: "Father Name"}, {n: "DOB", p: "Date of Birth", t: "date"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Photo", "Sign", "Payment Receipt"] },
            "voter": { name: "Voter Card (New/Correction)", price: 100, icon: "🗳️", fields: [{n: "Type", p: "New/Correction", s: ["New Voter", "Correction"]}, {n: "Name", p: "Full Name"}, {n: "DOB", p: "Date of Birth", t: "date"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Photo", "Sign", "Payment Receipt"] },
            "udyam": { name: "Udyam Registration", price: 300, icon: "🏢", fields: [{n: "Business_Name", p: "Business Name"}, {n: "Business_Type", p: "Business Type", s: ["Proprietorship", "Partnership", "Others"]}, {n: "Proprietor_Name", p: "Owner Name"}, {n: "DOB", p: "Owner DOB", t: "date"}, {n: "Aadhar_Number", p: "12 Digit Aadhar"}, {n: "Mobile", p: "Mobile"}], files: ["Aadhar", "Pan", "Payment Receipt"] },
            "pvc": { name: "PVC Card Print", price: 100, icon: "💳", fields: [{n: "Name", p: "Card Name"}, {n: "Mobile", p: "Mobile"}, {n: "Address", p: "Full Address"}], files: ["PDF_File", "Payment Receipt"] },
            "print_service": { name: "Print & Delivery", price: 30, icon: "📦", fields: [{n: "Name", p: "Name"}, {n: "Mobile", p: "Mobile"}, {n: "Pages", p: "Total Pages (Min 20)", t: "number", id: "pgCount", oninput: "calcPrint()"}, {n: "Address", p: "Full Delivery Address"}], files: ["PDF_File", "Payment Receipt"] },
            "track": { name: "Track Application", price: 0, icon: "🔍", fields: [], files: [] },
            "agent_reg": { name: "Agent Registration", price: 100, icon: "🔑", fields: [{n: "Name", p: "Name"}, {n: "Phone", p: "Phone"}], files: ["Receipt"] }
        };

        function calcPrint() {
            const pages = parseInt(document.getElementById('pgCount')?.value) || 0;
            let rate = pages > 100 ? 2.5 : 3;
            let total = (pages * rate) + 30;
            document.getElementById('priceSpan').innerText = pages >= 20 ? total : 0;
            document.getElementById('priceInfo').innerText = `Rate: ₹${rate}/page + ₹30 Delivery`;
            document.getElementById('payBtn').href = `upi://pay?pa=raja891958@ybl&pn=MyDream&am=${total}&cu=INR`;
        }

        function handleCorrection(id, val) {
            const container = document.getElementById('correctionFields');
            container.innerHTML = (val === "Correction") ? `<input type="text" name="Existing_ID" placeholder="Existing ID Number" required class="w-full p-3 border rounded-xl text-xs"><input type="text" name="Update_What" placeholder="What to update?" required class="w-full p-3 border-2 border-orange-200 rounded-xl text-xs">` : "";
        }

        function openForm(id) {
            const s = services[id];
            document.getElementById('modalTitle').innerText = s.name;
            document.getElementById('hiddenServiceName').value = s.name;
            document.getElementById('priceSpan').innerText = s.price;
            document.getElementById('priceInfo').innerText = "";
            document.getElementById('payBtn').href = `upi://pay?pa=raja891958@ybl&pn=MyDream&am=${s.price}&cu=INR`;
            
            document.getElementById('panImages').classList.toggle('hidden', id !== 'pan');
            document.getElementById('trackingUI').classList.toggle('hidden', id !== 'track');
            document.getElementById('applyForm').classList.toggle('hidden', id === 'track');
            document.getElementById('paymentSidebar').classList.toggle('hidden', id === 'track');

            document.getElementById('dynamicFields').innerHTML = s.fields.map(f => {
                let label = f.t === "date" ? `<p class="text-[8px] font-bold text-slate-400 uppercase mb-1">${f.p}</p>` : "";
                let attr = `name="${f.n}" placeholder="${f.p}" required class="w-full p-3 border rounded-xl text-xs outline-none focus:border-red-600"`;
                if(f.id) attr += ` id="${f.id}"`;
                if(f.oninput) attr += ` oninput="${f.oninput}"`;
                let input = f.s ? `<select ${attr} onchange="handleCorrection('${id}', this.value)">${f.s.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>` : `<input type="${f.t || 'text'}" ${attr}>`;
                return `<div>${label}${input}</div>`;
            }).join('');
            
            document.getElementById('uploadContainer').innerHTML = s.files.map(file => `<div class="p-3 border rounded-xl bg-slate-50 text-center"><p class="text-[8px] font-black uppercase text-slate-400">${file}</p><input type="file" required class="text-[8px] w-full"></div>`).join('');
            document.getElementById('formModal').classList.add('active');
        }

        async function fetchStatus() {
            const id = document.getElementById('trackIDInput').value.trim();
            if(!id) return alert("Enter ID!");
            try {
                const res = await fetch(`${SCRIPT_URL}?trackID=${id}`);
                const data = await res.json();
                document.getElementById('statusResult').classList.remove('hidden');
                document.getElementById('statusText').innerText = data.status === "Not Found" ? "❌ ID NOT FOUND" : "🚀 STATUS: " + data.status;
            } catch (e) { alert("Sync Error!"); }
        }

        async function validateForm(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const masterID = "MD-" + Math.floor(Math.random() * 900000 + 100000);
            submitBtn.innerHTML = "Syncing with Drive... ⏳";
            submitBtn.disabled = true;

            const filesArray = [];
            const readFile = (file) => new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, type: file.type, base64: reader.result.split(',')[1] });
            });

            const inputs = document.querySelectorAll('input[type="file"]');
            for (const input of inputs) { if (input.files[0]) filesArray.push(await readFile(input.files[0])); }

            const dataObj = { Unique_ID: masterID, Selected_Service: document.getElementById('hiddenServiceName').value, filesArray: filesArray };
            new FormData(document.getElementById('applyForm')).forEach((v, k) => dataObj[k] = v);

            try {
                // Background send
                fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(dataObj) });
                
                document.getElementById('displayUniqueID').innerText = masterID;
                document.getElementById('waNotifyBtn').onclick = () => window.location.href = `https://api.whatsapp.com/send?phone=918919580315&text=My ID: ${masterID}`;
                
                document.getElementById('formModal').classList.remove('active');
                document.getElementById('successModal').classList.add('active');

                // Trigger App
                window.location.assign(document.getElementById('payBtn').href);
            } catch (e) { alert("Error! Check Connection."); submitBtn.disabled = false; }
        }

        function closeForm() { document.getElementById('formModal').classList.remove('active'); }
        function closeSuccess() { document.getElementById('successModal').classList.remove('active'); }
        function renderGrid() {
            const grid = document.getElementById('general-grid');
            grid.innerHTML = Object.keys(services).filter(k => k !== 'agent_reg').map(id => {
                const s = services[id];
                return `<div class="service-card p-6 flex flex-col items-center text-center shadow-sm" onclick="openForm('${id}')"><div class="text-3xl mb-3">${s.icon}</div><h4 class="font-bold text-[10px] uppercase h-8 flex items-center">${s.name}</h4><p class="text-red-600 font-black text-sm mt-2">₹${s.price}</p></div>`;
            }).join('');
        }
        renderGrid();
    </script>
</body>
</html>
